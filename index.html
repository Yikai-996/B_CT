:root{
  color-scheme:light;
  --bg:#fff3f6; --bg2:#ffe2eb; --card:#ffffff; --paper:#fffaf3;
  --ink:#6a3546; --ink-soft:#a8707f; --pink:#ff9cba; --pink-deep:#ee6a94; --pink-pale:#ffd9e5;
  --gold:#f6c64f; --line:#ffc8d8; --shadow:0 14px 34px rgba(238,106,148,.20);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth}
*{margin:0; padding:0; box-sizing:border-box}
body{
  min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden; line-height:1.7; letter-spacing:.03em;
  background-image:radial-gradient(var(--pink-pale) 1.2px, transparent 1.4px); background-size:22px 22px;
}
body.locked{overflow:hidden; height:100%}
button{font:inherit; color:inherit; border:none; background:none; cursor:pointer; letter-spacing:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pink-deep); outline-offset:3px; border-radius:12px}
img{max-width:100%; display:block; -webkit-user-drag:none; user-select:none}

/* 花瓣 */
#petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden}
.petal{position:absolute; top:-30px; width:13px; height:10px; background:var(--pink); border-radius:12px 1px 12px 1px; opacity:.7; animation:drift linear infinite}
.petal.gold{background:var(--gold); width:8px; height:8px; border-radius:50%}
@keyframes drift{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-20px,110vh) rotate(360deg)}}

/* 点击小爱心 */
.tap-heart{position:fixed; z-index:90; pointer-events:none; color:var(--pink-deep); font-size:18px; animation:tapup 1s ease-out forwards}
@keyframes tapup{from{transform:translate(-50%,-50%) scale(.6); opacity:1}to{transform:translate(-50%,-160%) scale(1.3); opacity:0}}

/* ---------- 密码页 ---------- */
.gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:var(--bg2); padding:24px; transition:opacity .8s, visibility .8s}
.gate.hide{opacity:0; visibility:hidden}
.gate-card{text-align:center; width:100%; max-width:340px}
.peek-wrap{position:relative; height:140px; overflow:hidden; margin-bottom:6px}
.peek{position:absolute; right:0; bottom:0; height:150px; width:auto; transform:translateX(var(--px,42%)); transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.gate .meme{display:none; width:150px; margin:0 auto 6px; border-radius:16px; border:4px solid #fff; box-shadow:var(--shadow); animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.gate.ok .peek-wrap{display:none} .gate.ok .meme{display:block}
@keyframes pop{from{transform:scale(.4); opacity:0}}
.gate h1{font-size:1.45rem; font-weight:400}
.gate .hint{font-size:.92rem; color:var(--ink-soft); margin-top:2px}
.dots{display:flex; gap:12px; justify-content:center; margin:20px 0 6px}
.dots i{width:15px; height:15px; border-radius:50%; border:2px solid var(--pink-deep); transition:background .2s, transform .2s}
.dots i.on{background:var(--pink-deep); transform:scale(1.12)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{min-height:1.7em; font-size:.95rem; color:var(--pink-deep)}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px}
.keys button{height:56px; border-radius:20px; background:var(--card); font-size:1.4rem; box-shadow:0 4px 0 var(--line); transition:transform .08s, box-shadow .08s}
.keys button:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.keys button.small{font-size:1rem; color:var(--ink-soft)}

/* ---------- 通用 ---------- */
main{position:relative; z-index:2}
section{position:relative; min-height:100vh; min-height:100svh; padding:72px 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.sec-title{font-size:1.75rem; font-weight:400; color:var(--pink-deep)}
.sec-sub{color:var(--ink-soft); font-size:1rem; margin-top:2px}
.deco{position:absolute; width:78px; z-index:0; cursor:pointer}
.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-22px) rotate(-8deg)}}

/* ---------- 首屏 ---------- */
.hero-bun{position:relative; width:190px; cursor:pointer; margin-top:10px}
.hero-bun img{width:100%}
.bubble{position:absolute; left:50%; bottom:100%; transform:translate(-50%,6px) scale(.8); white-space:nowrap; background:var(--card); padding:6px 14px; border-radius:16px; box-shadow:var(--shadow); font-size:.95rem; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none}
.bubble::after{content:""; position:absolute; left:50%; top:100%; margin-left:-7px; border:7px solid transparent; border-top-color:var(--card)}
.bubble.show{opacity:1; transform:translate(-50%,-4px) scale(1)}
.tap-tip{font-size:.85rem; color:var(--ink-soft)}
.hero h2{font-size:clamp(2.3rem,12vw,4.2rem); white-space:nowrap; font-weight:400; line-height:1.15; margin-top:8px; color:var(--pink-deep)}
.hero h2 span{display:inline-block; opacity:0}
.unlocked .hero h2 span{animation:charpop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes charpop{from{opacity:0; transform:translateY(30px) scale(.5)}to{opacity:1; transform:none}}
.hero .to{font-size:1.2rem; margin-top:6px}
.hero .date{font-size:1rem; color:var(--ink-soft)}
.days{margin-top:24px; background:var(--card); border-radius:999px; padding:10px 22px; box-shadow:var(--shadow); font-size:1rem}
.days b{font-weight:400; font-size:1.6rem; color:var(--pink-deep); margin:0 6px}
.scroll-hint{position:absolute; bottom:calc(22px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); font-size:.9rem; color:var(--ink-soft); animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}

/* ---------- 蛋糕 ---------- */
.cake-wrap{position:relative; width:min(78vw,300px); margin:24px auto 8px}
.cake{width:100%; display:block}
.cake .candle{cursor:pointer}
.cake .flame{transform-origin:center bottom; transform-box:fill-box; animation:flicker .6s ease-in-out infinite alternate; transition:opacity .4s, transform .4s}
.cake .out .flame{opacity:0; transform:scale(.2)}
.cake .smoke{opacity:0}
.cake .out .smoke{animation:smoke 1.2s ease-out forwards}
@keyframes flicker{to{transform:scale(1.08,.92) rotate(3deg)}}
@keyframes smoke{0%{opacity:.6; transform:translateY(0)}100%{opacity:0; transform:translateY(-18px)}}
.cake-bun{position:absolute; right:-14%; bottom:-6%; width:42%; pointer-events:none}
.wish{min-height:3.4em; font-size:1.05rem; color:var(--ink-soft); white-space:pre-line}
.wish.done{color:var(--pink-deep)}

/* ---------- 礼物 ---------- */
.gift{width:190px; margin:22px auto 4px; cursor:pointer; transition:transform .2s}
.gift.wiggle{animation:wiggle .5s}
@keyframes wiggle{20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.gift-hint{min-height:1.8em; color:var(--ink-soft)}
.coupons{display:grid; gap:14px; width:100%; max-width:380px; margin-top:12px}
.coupon{position:relative; background:var(--card); border:2px dashed var(--pink); border-radius:16px; padding:14px 18px; text-align:left; box-shadow:var(--shadow); cursor:pointer; opacity:0; transform:translateY(30px) scale(.9); transition:opacity .5s, transform .5s cubic-bezier(.3,1.5,.5,1)}
.coupon.in{opacity:1; transform:none}
.coupon h4{font-weight:400; font-size:1.2rem; color:var(--pink-deep)}
.coupon p{font-size:.92rem; color:var(--ink-soft)}
.stamp{position:absolute; right:14px; top:50%; transform:translateY(-50%) rotate(-14deg) scale(2); border:2px solid var(--pink-deep); color:var(--pink-deep); border-radius:10px; padding:2px 10px; font-size:.95rem; opacity:0; transition:opacity .25s, transform .3s cubic-bezier(.3,1.6,.5,1); background:rgba(255,255,255,.8)}
.coupon.used .stamp{opacity:1; transform:translateY(-50%) rotate(-14deg) scale(1)}

/* ---------- 翻页相册 ---------- */
.book-wrap{margin-top:24px; width:100%; display:flex; flex-direction:column; align-items:center}
.book{position:relative; width:min(86vw,360px); aspect-ratio:3/4.3; perspective:1600px; touch-action:pan-y; user-select:none; -webkit-user-select:none; border-radius:6px 18px 18px 6px; box-shadow:var(--shadow)}
.page{position:absolute; inset:0; background:var(--paper); border-radius:6px 18px 18px 6px; box-shadow:0 1px 3px rgba(238,106,148,.12); padding:18px 18px 16px 26px; display:flex; flex-direction:column; transform-origin:left center; transition:transform .9s cubic-bezier(.55,.05,.3,1); backface-visibility:hidden; -webkit-backface-visibility:hidden; text-align:left; overflow:hidden}
.page::before{content:""; position:absolute; left:0; top:0; bottom:0; width:16px; background:linear-gradient(90deg, rgba(238,106,148,.18), transparent)}
.page.flipped{transform:rotateY(-178deg); pointer-events:none}
.photo{position:relative; flex:1; min-height:0; border-radius:10px; overflow:hidden; background:var(--pink-pale); cursor:pointer}
.photo img{position:absolute; inset:0; width:100%; height:100%}
.photo img.blur{object-fit:cover; filter:blur(18px) saturate(1.1); transform:scale(1.2); opacity:.85}
.photo img.fg{object-fit:contain}
.photo .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--pink-deep); font-size:1rem; background:repeating-linear-gradient(45deg, var(--pink-pale) 0 14px, var(--bg2) 14px 28px)}
.big-heart{position:absolute; left:50%; top:50%; font-size:5rem; color:#fff; text-shadow:0 4px 16px rgba(238,106,148,.6); transform:translate(-50%,-50%) scale(0); pointer-events:none}
.big-heart.go{animation:bigheart .9s ease-out}
@keyframes bigheart{30%{transform:translate(-50%,-50%) scale(1.15); opacity:1}100%{transform:translate(-50%,-50%) scale(1); opacity:0}}
.meta{padding-top:10px}
.meta .when{display:inline-block; font-size:.85rem; color:var(--pink-deep); background:var(--bg2); border-radius:999px; padding:0 10px}
.meta h3{font-size:1.05rem; font-weight:400; margin-top:4px; line-height:1.6}
.meta p{font-size:.95rem; color:var(--ink-soft)}
.cover{justify-content:center; align-items:center; text-align:center; background:var(--bg2)}
.cover img{width:62%; margin-bottom:8px}
.cover h3{font-size:1.7rem; font-weight:400; color:var(--pink-deep)}
.cover p{color:var(--ink-soft)}
.book-nav{display:flex; align-items:center; gap:22px; margin-top:20px}
.book-nav button{width:50px; height:50px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:1.5rem; color:var(--pink-deep)}
.book-nav button:disabled{opacity:.35}
.book-nav .idx{min-width:70px; color:var(--ink-soft)}
.tip{font-size:.88rem; color:var(--ink-soft); margin-top:6px}

/* ---------- 信 ---------- */
.env-area{position:relative; width:min(80vw,320px); margin:110px auto 0}
.env-bun{position:absolute; right:-12%; bottom:-22%; width:42%; z-index:6; pointer-events:none}
.envelope{position:relative; width:100%; aspect-ratio:1.55; cursor:pointer}
.env-back{position:absolute; inset:0; background:#f7a6bf; border-radius:12px}
.env-letter{position:absolute; left:7%; right:7%; top:8%; height:84%; background:#fffaf3; border-radius:8px; z-index:2; transition:transform .8s .45s cubic-bezier(.3,.7,.3,1); padding:12px 14px; color:#a8707f; text-align:left}
.env-front{position:absolute; inset:0; z-index:3; background:#ffbcd0; border-radius:12px; clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute; left:0; right:0; top:0; height:60%; z-index:4; background:#ff9cba; clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .6s, z-index 0s .3s; border-radius:12px 12px 0 0}
.env-seal{position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); z-index:5; font-size:1.8rem; color:#fff; transition:opacity .3s}
.envelope.open .env-flap{transform:rotateX(180deg); z-index:1}
.envelope.open .env-seal{opacity:0}
.envelope.open .env-letter{transform:translateY(-48%)}
.env-tip{color:var(--ink-soft); margin-top:30px}
.letter{width:100%; max-width:560px; background:#fffaf3; border-radius:16px; box-shadow:var(--shadow); padding:30px 24px; text-align:left; margin-top:28px; display:none; opacity:0; transform:translateY(16px); transition:opacity .7s, transform .7s; background-image:repeating-linear-gradient(transparent 0 33px, #ffd9e5 33px 34px); line-height:34px; font-size:1.05rem; cursor:pointer}
.letter.show{opacity:1; transform:none}
.letter .text{white-space:pre-wrap; min-height:6em}
.letter .text::after{content:"|"; color:var(--pink-deep); animation:blink 1s steps(1) infinite}
.letter.done .text::after{content:""}
@keyframes blink{50%{opacity:0}}
.letter .sign{text-align:right; margin-top:14px; opacity:0; transition:opacity .8s}
.letter.done .sign{opacity:1}
.letter-skip{font-size:.85rem; color:var(--ink-soft); margin-top:10px; display:none}

/* ---------- 结尾 ---------- */
.ending-bun{width:200px; cursor:pointer}
.ending h2{font-size:clamp(2.1rem,10vw,3rem); font-weight:400; color:var(--pink-deep); margin-top:8px}
.ending .lines{margin-top:12px; font-size:1.15rem; line-height:2}
.btns{display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; justify-content:center}
.btn{background:var(--pink-deep); color:#fff; padding:12px 26px; border-radius:999px; box-shadow:var(--shadow); font-size:1.05rem}
.btn.ghost{background:var(--card); color:var(--pink-deep)}
.float-heart{position:fixed; bottom:-40px; z-index:85; pointer-events:none; animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(var(--r)); opacity:.2}}

/* ---------- 音乐 & 彩纸 ---------- */
.music{position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:60; width:44px; height:44px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:1.2rem; display:none}
.music.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed; top:-14px; width:8px; height:13px; z-index:70; pointer-events:none; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(800deg)}}

@media (prefers-reduced-motion: reduce){
  .petal,.scroll-hint,.cake .flame{animation:none}
  .page{transition-duration:.01s}
}
</style>
</head>

  ],

  /* 信（{n} 会自动换成在一起的天数，和首屏一致） */
  letterTitle: "有一封信给你",
  envPeek:     "给我的宝宝 ♡",
  envTip:      "点一下拆开",
  letterSkip:  "点信纸可以直接看完",
  letter: `亲爱的宝宝：
这是我们在一起的第{n}天，过去的每一天我都超级爱你哦~~

我真的超级幸福和幸运，能够在异国他乡遇到你、认识你，并且与你相互陪伴和鼓励。过去的这一年，是我最开心快乐的时光。

我知道在相处的过程中，我们的性格差异可能会让我们时常对彼此产生一些误解，但是我们都有在努力地相互理解、支持，一起克服这些困难。我相信随着时间的推移，我们一定会变得更好。

你是一个非常非常善良的女孩，可爱漂亮、有能力、有毅力，你在很多事情上展现出来的韧劲是我非常佩服的（着重点名秋招和暑期实习），所以一定要相信你自己，不要因为一些愚蠢的人和事情而怀疑自己！

总之，在这个美好的日子里，祝福我最最最最最最可爱的宝宝，生日快乐！！！希望我们的未来能够越来越好！`,
  signature:   "—— 永远爱你的猪猪大王",

  /* 结尾 */
  endTitle: "生日快乐，宝宝",
  endLines: ["愿新的一岁，你每天都开开心心", "被好好爱着，也一直可爱下去", "做最幸福的自己哦~~"],
  wishBtn:  "放飞祝福",
  againBtn: "回到开头",

  /* 背景音乐（之后嵌入） */
  musicSrc: "music.mp3"
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll("[data-t]").forEach(el => el.textContent = COPY[el.dataset.t] ?? "");
$("#heroTitle").innerHTML = [...COPY.heroTitle].map((ch,i) => `<span style="animation-delay:${.35 + i*.14}s">${esc(ch)}</span>`).join("");
$("#endLines").innerHTML = COPY.endLines.map(l => `<p>${esc(l)}</p>`).join("");

/* 在一起天数 */
const [sy,sm,sd] = COPY.startDate;
const now = new Date();
const dayN = Math.max(1, Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(sy,sm-1,sd)) / 86400000) + 1);
function countUp(){
  const el = $("#dayCount"); if (reduce){ el.textContent = dayN; return; }
  const t0 = performance.now(), dur = 1600;
  (function f(t){ const p = Math.min(1,(t-t0)/dur); el.textContent = Math.round(dayN*(1-Math.pow(1-p,3))); if (p<1) requestAnimationFrame(f); })(t0);
}

/* 小特效 */
function startPetals(){
  if (reduce) return;
  for (let i = 0; i < 16; i++){
    const p = document.createElement("span");
    p.className = "petal" + (i % 4 === 0 ? " gold" : "");
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (9 + Math.random()*8) + "s";
    p.style.animationDelay = (-Math.random()*16) + "s";
    $("#petals").appendChild(p);
  }
}
function confetti(n = 90){
  const colors = ["#ff9cba","#ee6a94","#ffd9e5","#f6c64f","#b9e4ff","#ffffff"];
  for (let i = 0; i < n; i++){
    const c = document.createElement("span"); c.className = "confetti";
    c.style.left = Math.random()*100 + "vw"; c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", (Math.random()*120-60) + "px");
    c.style.animationDuration = (2.4 + Math.random()*2) + "s"; c.style.animationDelay = Math.random()*.6 + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 5200);
  }
}
function floatHearts(n = 24){
  const marks = ["♥","🐰","♡","🐷","❀","🐰","♥","🐷"];
  for (let i = 0; i < n; i++){
    const h = document.createElement("span"); h.className = "float-heart";
    h.textContent = marks[i % marks.length];
    h.style.left = Math.random()*100 + "vw";
    h.style.fontSize = (16 + Math.random()*22) + "px";
    h.style.color = ["#ee6a94","#ff9cba","#f6c64f"][i % 3];
    h.style.setProperty("--dx", (Math.random()*80-40) + "px");
    h.style.setProperty("--r", (Math.random()*60-30) + "deg");
    h.style.animationDuration = (3.5 + Math.random()*2.5) + "s"; h.style.animationDelay = Math.random()*1.2 + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 7500);
  }
}
document.addEventListener("pointerdown", e => {
  if (document.body.classList.contains("locked")) return;
  const h = document.createElement("span"); h.className = "tap-heart"; h.textContent = "♥";
  h.style.left = e.clientX + "px"; h.style.top = e.clientY + "px";
  document.body.appendChild(h); setTimeout(() => h.remove(), 1000);
});
function hop(el){ el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); }
document.querySelectorAll(".deco").forEach(d => d.addEventListener("click", () => hop(d)));

/* 音乐 */
let audio = null; const musicBtn = $("#music");
if (COPY.musicSrc){
  audio = new Audio(COPY.musicSrc); audio.loop = true; musicBtn.style.display = "block";
  musicBtn.onclick = () => {
    if (audio.paused){ audio.play().catch(()=>{}); musicBtn.classList.add("playing"); }
    else { audio.pause(); musicBtn.classList.remove("playing"); }
  };
}

/* 密码页：每输一位，兔兔多探出来一点 */
let code = "", wrongCount = 0;
const dots = [...document.querySelectorAll("#dots i")], peek = $("#peek");
function render(){
  dots.forEach((d,i) => d.classList.toggle("on", i < code.length));
  peek.style.setProperty("--px", (42 - code.length*7) + "%");
}
function press(k){
  if (k === "del") code = code.slice(0,-1);
  else if (k === "clr") code = "";
  else if (code.length < 6) code += k;
  render();
  if (code.length === 6 && code === COPY.password && audio){
    audio.play().then(() => musicBtn.classList.add("playing")).catch(()=>{});
  }
  if (code.length === 6) setTimeout(check, 200);
}
function check(){
  if (code === COPY.password){
    $("#msg").textContent = COPY.gateRight; $("#gate").classList.add("ok");
    setTimeout(() => {
      $("#gate").classList.add("hide"); document.body.classList.remove("locked"); document.body.classList.add("unlocked");
      startPetals(); countUp();
    }, 1600);
  } else {
    $("#msg").textContent = COPY.gateWrong[Math.min(wrongCount++, COPY.gateWrong.length-1)];
    $("#dots").classList.add("shake");
    setTimeout(() => { $("#dots").classList.remove("shake"); code = ""; render(); }, 450);
  }
}
$("#keys").innerHTML = ["1","2","3","4","5","6","7","8","9","clr","0","del"].map(k =>
  `<button data-k="${k}" class="${k.length>1?'small':''}">${k==="clr"?"清空":k==="del"?"⌫":k}</button>`).join("");
$("#keys").addEventListener("click", e => { const b = e.target.closest("button"); if (b) press(b.dataset.k); });
document.addEventListener("keydown", e => {
  if ($("#gate").classList.contains("hide")) return;
  if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("del");
});
render();

/* 首屏：戳兔兔 */
let bubbleI = 0, bubbleT;
function pokeHero(){
  const b = $("#bubble"), bun = $("#heroBun");
  b.textContent = COPY.heroBubbles[bubbleI++ % COPY.heroBubbles.length];
  b.classList.add("show"); hop(bun);
  clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove("show"), 1800);
}
$("#heroBun").addEventListener("click", pokeHero);
$("#heroBun").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pokeHero(); } });

/* 蛋糕 */
let lit = 3; const wish = $("#wish");
wish.textContent = COPY.cakeLeft.replace("{n}", lit);
document.querySelectorAll(".cake .candle").forEach(c => c.addEventListener("click", () => {
  if (c.classList.contains("out")) return;
  c.classList.add("out"); lit--;
  if (lit > 0) wish.textContent = COPY.cakeLeft.replace("{n}", lit);
  else { wish.textContent = COPY.cakeDone; wish.classList.add("done"); confetti(); }
}));

/* 礼物：戳三下 */
let giftTaps = 0, giftOpen = false;
function pokeGift(){
  if (giftOpen) return;
  const g = $("#gift"); g.classList.remove("wiggle"); void g.offsetWidth; g.classList.add("wiggle");
  giftTaps++;
  if (giftTaps < 3){ $("#giftHint").textContent = COPY.giftTaps[giftTaps-1] || ""; return; }
  giftOpen = true; $("#giftHint").textContent = COPY.giftOpened; confetti(60);
  const box = $("#coupons");
  box.innerHTML = COPY.coupons.map(c => `<div class="coupon" role="button" tabindex="0"><h4>${esc(c.title)}</h4><p>${esc(c.desc)}</p><span class="stamp">${esc(COPY.couponStamp)}</span></div>`).join("");
  [...box.children].forEach((el,i) => {
    setTimeout(() => el.classList.add("in"), 200 + i*220);
    el.addEventListener("click", () => { if (!el.classList.contains("used")){ el.classList.add("used"); floatHearts(8); } });
  });
}
$("#gift").addEventListener("click", pokeGift);
$("#gift").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pokeGift(); } });

/* 照片数据 */
const PHOTO_DATA = [
"photos/00.jpg",
"photos/01.jpg",
"photos/02.jpg",
"photos/03.jpg",
"photos/04.jpg",
"photos/05.jpg",
"photos/06.jpg",
"photos/07.jpg",
"photos/08.jpg",
"photos/09.jpg",
"photos/10.jpg",
"photos/11.jpg",
"photos/12.jpg",
"photos/13.jpg",
"photos/14.jpg"
];

/* 相册 */
const pagesHTML = [
  `<div class="page cover"><img src="img/b01.webp" alt=""><h3>${esc(COPY.albumCoverTitle)}</h3><p>${esc(COPY.albumCoverSub)}</p></div>`,
  ...COPY.photos.map((p,i) => `
    <div class="page">
      <div class="photo">${PHOTO_DATA[p.img] ? `<img class="blur" src="${PHOTO_DATA[p.img]}" alt=""><img class="fg" src="${PHOTO_DATA[p.img]}" alt="${esc(p.title)}">` : `<div class="ph">照片 ${i+1}</div>`}<span class="big-heart">♥</span></div>
      <div class="meta">${p.when ? `<span class="when">${esc(p.when)}</span>` : ""}${p.title ? `<h3>${esc(p.title)}</h3>` : ""}${p.text ? `<p>${esc(p.text)}</p>` : ""}</div>
    </div>`),
  `<div class="page cover"><img src="img/b22.webp" alt=""><h3>${esc(COPY.albumEndTitle)}</h3><p>${esc(COPY.albumEndSub)}</p></div>`
];
const book = $("#book"); book.innerHTML = pagesHTML.join("");
const pages = [...book.querySelectorAll(".page")];
pages.forEach((p,i) => p.style.zIndex = pages.length - i);
let cur = 0;
function updateBook(){
  $("#prev").disabled = cur === 0; $("#next").disabled = cur === pages.length-1;
  $("#idx").textContent = cur === 0 ? "封面" : cur === pages.length-1 ? "封底" : cur + " / " + COPY.photos.length;
}
function next(){ if (cur < pages.length-1){ pages[cur].classList.add("flipped"); cur++; updateBook(); } }
function prev(){ if (cur > 0){ cur--; pages[cur].classList.remove("flipped"); updateBook(); } }
$("#next").onclick = next; $("#prev").onclick = prev;
/* 手指拖动翻页：页面跟着手指转，松手过半就翻过去 */
let drag = null, justDragged = false;
book.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  drag = { x:e.clientX, y:e.clientY, id:e.pointerId, on:false, page:null, dir:null, p:0 };
});
book.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, w = book.clientWidth;
  if (!drag.on){
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) { if (Math.abs(dy) > 12) drag = null; return; }
    drag.on = true; try { book.setPointerCapture(e.pointerId); } catch(_){}
  }
  let dir = dx < 0 ? "next" : "prev";
  if ((dir === "next" && cur >= pages.length-1) || (dir === "prev" && cur <= 0)) dir = null;
  if (drag.page && drag.dir !== dir){ drag.page.style.transition = ""; drag.page.style.transform = ""; drag.page = null; }
  drag.dir = dir; if (!dir) return;
  const p = Math.min(1, Math.abs(dx) / (w * 0.9));
  drag.p = p;
  drag.page = dir === "next" ? pages[cur] : pages[cur-1];
  drag.page.style.transition = "none";
  drag.page.style.transform = `rotateY(${dir === "next" ? -178*p : -178*(1-p)}deg)`;
});
function endDrag(){
  if (!drag) return;
  if (drag.on){
    justDragged = true; setTimeout(() => justDragged = false, 50);
    if (drag.page){
      const pg = drag.page, go = drag.p > 0.3;
      pg.style.transition = ""; pg.style.transform = "";
      if (go) (drag.dir === "next" ? next : prev)();
    }
  }
  drag = null;
}
book.addEventListener("pointerup", endDrag);
book.addEventListener("pointercancel", endDrag);
book.addEventListener("click", e => {
  if (justDragged) return;
  const ph = e.target.closest(".photo"); if (!ph) return;
  const h = ph.querySelector(".big-heart"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
});
updateBook();

/* 信：拆信封 + 打字机 */
const env = $("#envelope"), L = $("#letter"), LT = $("#letterText");
let typing = null;
const letterText = () => COPY.letter.replace("{n}", dayN);
function finishLetter(){ clearInterval(typing); LT.textContent = letterText(); L.classList.add("done"); $("#letterSkip").style.display = "none"; }
function openEnvelope(){
  if (env.classList.contains("open")) return;
  env.classList.add("open"); $("#envTip").textContent = "";
  $("#letterSign").textContent = COPY.signature;
  setTimeout(() => {
    L.style.display = "block"; $("#letterSkip").style.display = "block";
    requestAnimationFrame(() => L.classList.add("show"));
    L.scrollIntoView({behavior:"smooth", block:"start"});
    if (reduce){ finishLetter(); return; }
    let i = 0; const chars = [...letterText()];
    typing = setInterval(() => { LT.textContent += chars[i++] || ""; if (i >= chars.length) finishLetter(); }, 50);
  }, 1300);
}
env.addEventListener("click", openEnvelope);
env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openEnvelope(); } });
L.addEventListener("click", finishLetter);

/* 结尾 */
$("#wishBtn").onclick = () => { floatHearts(30); hop($("#endBun")); };
$("#endBun").addEventListener("click", () => { hop($("#endBun")); floatHearts(10); });
$("#again").onclick = () => window.scrollTo({top:0, behavior:"smooth"});
</script>
</body>
